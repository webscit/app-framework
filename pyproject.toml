

[project]
name = "app-framework-meta"
version = "0.0.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "framework-core",
  "drone-example",
  "reachy-mini-example",
  "simple-example",
]

[dependency-groups]
dev = [
  "anyio[trio]>=4.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "mypy>=1.10",
  "pydantic>=2.0",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-anyio>=0.0.0",
  "ruff>=0.4.4",
]

[tool.uv.workspace]
members = ["pypackages/*", "examples/*"]

[tool.uv.sources]
framework-core = { workspace = true }
drone-example = { workspace = true }
reachy-mini-example = { workspace = true }
simple-example = { workspace = true }

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/", "examples/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# AI prompt strings contain intentionally long lines that must not be wrapped.
"pypackages/framework-core/src/framework_core/ai_layout.py" = ["E501"]
