[project]
name = "drone-example"
version = "0.1.0"
# FMPy recompiles Drone.fmu's bundled C sources on macOS/Linux (the FMU only
# ships a Windows binary), so a C toolchain is required at first run. FMPy
# publishes wheels for CPython 3.9–3.13; the repo venv (3.14) is outside that
# range, so this example is pinned and run with its own interpreter — see
# examples/drone/README.md.
requires-python = ">=3.11,<3.13"
dependencies = [
    "sci-framework-core",
    "fastapi",
    # [standard] pulls in `websockets`, which the /ws EventBus bridge needs
    "uvicorn[standard]",
    "fmpy",
]

[tool.uv.sources]
sci-framework-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/drone_example"]