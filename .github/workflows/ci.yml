name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy pypackages/framework-core/src
      - name: Run Python tests
        run: |
          uv run pytest pypackages/framework-core
          uv run pytest examples/drone
          uv run pytest examples/reachy_mini

  typescript-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # npm install is used instead of npm ci because the lock file is generated on
        # macOS (arm64) and CI runs on Linux (x64). npm ci fails due to a known npm bug
        # with optional dependencies (https://github.com/npm/cli/issues/4828) where
        # platform-specific binaries like @rollup/rollup-linux-x64-gnu are missing.
        run: |
          npm ci || npm install
          git diff --exit-code package-lock.json

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Vitest
        run: npm run test

  package-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install JS dependencies
        # npm install is used instead of npm ci because the lock file is generated on
        # macOS (arm64) and CI runs on Linux (x64). npm ci fails due to a known npm bug
        # with optional dependencies (https://github.com/npm/cli/issues/4828) where
        # platform-specific binaries like @rollup/rollup-linux-x64-gnu are missing.
        run: |
          npm ci || npm install
          git diff --exit-code package-lock.json

      - name: Build Python package
        run: |
          cd pypackages/framework-core
          uv build --out-dir ../../dist
          cd ../../examples/simple
          uv build --out-dir ../../dist

      - name: Install wheel in isolated environment
        run: |
          uv venv .e2e-venv --seed
          .e2e-venv/bin/pip install -f ./dist simple-example

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          .e2e-venv/bin/python -m uvicorn simple_example.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!

          cleanup() {
            kill "$BACKEND_PID"
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl -fsS "$BACKEND_URL/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          npx playwright test

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload package wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-wheel
          path: pypackages/framework-core/dist/*.whl
